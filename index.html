<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Ballparks we’ve been to</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F1E6CC;      /* scorecard stock */
    --land: #FBF5E6;       /* map land */
    --navy: #1A2B4C;
    --red: #B22234;        /* stitch red */
    --muted: #586174;
    --rule: #CDBB93;
    --water: #D1CAB9;      /* paper with a wash of navy */
    --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--navy);
    font: 400 1.0625rem/1.6 var(--body);
  }
  .page { max-width: 76rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

  header { margin-bottom: 1.75rem; max-width: 46rem; }
  h1 {
    font: 400 clamp(2.25rem, 6vw, 4rem)/1.02 var(--display);
    margin: 0 0 .75rem;
    letter-spacing: .005em;
  }
  .tally { margin: 0; font-size: 1.1875rem; color: var(--muted); }
  .tally strong { color: var(--navy); font-weight: 600; }

  .board { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .board { grid-template-columns: minmax(0, 2.1fr) minmax(16rem, 1fr); align-items: start; } }

  .map-wrap { position: relative; border: 2px solid var(--navy); background: var(--water); }
  .map-wrap svg { display: block; width: 100%; height: auto; }
  .land { fill: var(--land); stroke: var(--navy); stroke-width: .9; stroke-linejoin: round; }
  .lakes { fill: var(--water); stroke: var(--navy); stroke-width: .6; }
  .borders { fill: none; stroke: var(--navy); stroke-width: 1.1; stroke-linejoin: round; }
  .states { fill: none; stroke: var(--rule); stroke-width: .7; stroke-linejoin: round; }

  .pin { cursor: pointer; outline: none; }
  .leader { fill: none; stroke: var(--navy); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .anchor { fill: var(--navy); }
  .plate { fill: var(--land); stroke: var(--navy); stroke-width: 1.4; }
  .ball { fill: #fff; stroke: var(--navy); stroke-width: 1.2; }
  .stitch { fill: none; stroke: var(--red); stroke-width: 1.3; stroke-linecap: round; }
  .halo { fill: none; stroke: var(--red); stroke-width: 2; opacity: 0; pointer-events: none; }
  .pin:hover .halo, .pin:focus-visible .halo { opacity: .55; }
  .pin[aria-pressed="true"] .halo { opacity: 1; }

  .tip {
    position: absolute; pointer-events: none;
    transform: translate(-50%, calc(-100% - 14px));
    background: var(--navy); color: var(--land);
    font: 600 .875rem/1.3 var(--body);
    padding: .3rem .6rem; white-space: nowrap;
    opacity: 0; transition: opacity .12s;
  }
  .tip.show { opacity: 1; }

  .legend { display: flex; flex-wrap: wrap; gap: 1.25rem; margin: .6rem 0 0; font-size: .9375rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: .45rem; }
  .legend svg { width: 18px; height: 18px; }

  .card { border-top: 6px solid var(--red); background: var(--land); border-left: 2px solid var(--navy); border-right: 2px solid var(--navy); border-bottom: 2px solid var(--navy); padding: 1.25rem 1.25rem 1.5rem; }
  .card h2 { font: 400 1.75rem/1.1 var(--display); margin: 0 0 .35rem; }
  .card .where { margin: 0 0 1.1rem; color: var(--muted); }
  .card ol { list-style: none; margin: 0; padding: 0; }
  .card li { padding: .7rem 0; border-top: 1px solid var(--rule); }
  .card li:last-child { border-bottom: 1px solid var(--rule); }
  .card time { display: block; font-size: .9375rem; color: var(--muted); }
  .card .game { font-weight: 600; display: block; }
  .card .result { display: block; color: var(--red); font-size: .9375rem; }
  .card .empty { margin: 0; font-style: italic; color: var(--muted); }

  section.log { margin-top: 3rem; }
  section.log h2 { font: 400 1.75rem/1.1 var(--display); margin: 0 0 1rem; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .65rem .75rem .65rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 600; font-size: .9375rem; color: var(--muted); border-bottom: 2px solid var(--navy); }
  @media (min-width: 600px) { td:first-child { white-space: nowrap; } }
  @media (max-width: 599px) { table { font-size: .9375rem; } }
  tbody tr { cursor: pointer; }
  tbody tr:hover td, tbody tr.current td { background: var(--land); }
  tbody tr:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
  td button { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
  td button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
</style>
</head>

  ["Rate Field","Chicago White Sox","Chicago, IL",41.8299,-87.6338],

].map(([name, team, city, lat, lon]) => ({ name, team, city, lat, lon, current: true }));

/* ---------- Visits ----------
   Columns: date (YYYY-MM-DD), ballpark, away_team, home_team
   Optional: away_score, home_score (the winner is worked out from these)
   Optional: city, lat, lon — only needed for a park not in the list above
   (a former park, spring training, etc.). */

/* Paste your published Google Sheet CSV link here (File > Share > Publish to web,
   choose the tab, choose "Comma-separated values"). If the sheet can't be reached,
   the backup games below are shown instead. */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSOTZw_QlKtwdXdoudGaWx5MvolRMQQgPsdm05qQRROUcbedzDsJ_z53hEkOCjUWUfi44rMPnSU0wwF/pub?output=csv";

const VISITS_CSV = `date,ballpark,away_team,home_team,away_score,home_score
2013_07_26,Coors Field,Milwaukee Brewers,Colorado Rockies,3,8
2014_06_18,Fenway Park,Minnesota Twins,Boston Red Sox,1,2
2014_09_21,Wrigley Field,Los Angeles Dodgers,Chicago Cubs,8,5
2015_07_27,Oracle Park,Milwaukee Brewers,San Francisco Giants,2,4
2016_05_06,Rate Field,Minnesota Twins,Chicago White Sox,4,10
2018_08_10,Comerica Park,Minnesota Twins,Detroit Tigers,3,5
2019_06_30,American Family Field,Pittsburgh Pirates,Milwaukee Brewers,1,2
2025_06_07,Great American Ball Park,Arizona Diamondbacks,Cincinnati Reds,1,13`;

/* ---------- CSV parsing (handles quoted fields) ---------- */
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(v => v.trim())).map(r =>
    Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
}

/* ---------- Projection (Albers equal-area, matches the drawn map) ---------- */
const project = (() => {
  const R = 1000, rad = Math.PI / 180, l1 = 29.5 * rad, l2 = 45.5 * rad, l0 = 37.5 * rad, lon0 = -96 * rad;
  const n = (Math.sin(l1) + Math.sin(l2)) / 2, C = Math.cos(l1) ** 2 + 2 * n * Math.sin(l1);
  const rho0 = R * Math.sqrt(C - 2 * n * Math.sin(l0)) / n;
  return (lat, lon) => {
    const rho = R * Math.sqrt(C - 2 * n * Math.sin(lat * rad)) / n, th = n * (lon * rad - lon0);
    return [rho * Math.sin(th) + 500, -(rho0 - rho * Math.cos(th)) + 320];
  };
})();

/* ---------- Dates: accepts 2024-08-10, 2024_08_10 or 8/10/2024 ---------- */
function isoDate(s) {
  s = (s || "").trim();
  let m = s.match(/^(\d{4})[-_\/.](\d{1,2})[-_\/.](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  return "";
}

const key = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
const fmtDate = d => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
const result = v => {
  const a = parseInt(v.away_score, 10), h = parseInt(v.home_score, 10);
  if (isNaN(a) || isNaN(h)) return "";
  if (a === h) return `Tied ${a}–${h}`;
  const winner = a > h ? v.away_team : v.home_team;
  return `${winner || "Home team"} won ${Math.max(a, h)}–${Math.min(a, h)}`;
};
const matchup = v => v.away_team ? `${v.away_team} at ${v.home_team}` : `${v.home_team} home game`;
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map"), pinLayer = document.getElementById("pins");
const tip = document.getElementById("tip"), card = document.getElementById("card");
const tally = document.getElementById("tally"), body = document.getElementById("logBody");
let allParks = [], selected = null;

function render(csvText, note) {
  /* build data */
  const parks = new Map(PARKS.map(p => [key(p.name), { ...p, visits: [] }]));
  for (const row of parseCSV(csvText)) {
    const v = { ...row, date: isoDate(row.date) };
    if (!v.date || !v.ballpark) continue; // rows without a date are parks not visited yet
    const k = key(v.ballpark);
    if (!parks.has(k)) {
      if (!v.lat || !v.lon) { console.warn(`No location for “${v.ballpark}”. Add lat and lon columns for this row.`); continue; }
      parks.set(k, { name: v.ballpark, team: v.home_team, city: v.city || "", lat: +v.lat, lon: +v.lon, current: false, visits: [] });
    }
    parks.get(k).visits.push(v);
  }
  allParks = [...parks.values()];
  allParks.forEach(p => p.visits.sort((a, b) => a.date.localeCompare(b.date)));

  /* tally */
  const visitedCurrent = PARKS.filter(p => parks.get(key(p.name)).visits.length).length;
  const games = allParks.reduce((s, p) => s + p.visits.length, 0);
  tally.innerHTML = `<strong>${visitedCurrent} of ${PARKS.length}</strong> big-league parks, ${games} game${games === 1 ? "" : "s"} in all. Pick a park on the map to see who we watched.` +
    (note ? ` <em>${esc(note)}</em>` : "");

  /* pins */
  pinLayer.replaceChildren();
  const order = [...allParks].sort((a, b) => (a.visits.length > 0) - (b.visits.length > 0) || b.lat - a.lat);
  for (const p of order) {
    const [x, y] = project(p.lat, p.lon);
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "pin");
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-pressed", "false");
    g.setAttribute("aria-label", `${p.name}, ${p.visits.length ? `visited ${p.visits.length} time${p.visits.length > 1 ? "s" : ""}` : "not visited yet"}`);
    g.dataset.x = x; g.dataset.y = y;
    g.innerHTML = p.visits.length
      ? `<circle class="halo" r="12.5"/><circle class="ball" r="8"/><path class="stitch" d="M-4.5,-6.2 Q-1.8,0 -4.5,6.2 M4.5,-6.2 Q1.8,0 4.5,6.2"/>`
      : `<circle class="halo" r="10.5"/><path class="plate" d="M-5,-5 H5 V1 L0,6 L-5,1 Z"/>`;
    p.el = g;
    const show = () => { tip.textContent = p.name; positionTip(p); tip.classList.add("show"); };
    const hide = () => tip.classList.remove("show");
    g.addEventListener("mouseenter", show); g.addEventListener("mouseleave", hide);
    g.addEventListener("focus", show); g.addEventListener("blur", hide);
    g.addEventListener("click", () => select(p));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(p); } });
    pinLayer.appendChild(g);
  }

  /* game log */
  const log = allParks.flatMap(p => p.visits.map(v => ({ ...v, park: p }))).sort((a, b) => b.date.localeCompare(a.date));
  body.innerHTML = log.length
    ? log.map(v => `<tr data-park="${key(v.park.name)}"><td><time datetime="${v.date}">${fmtDate(v.date)}</time></td><td><button type="button">${esc(v.park.name)}</button></td><td>${esc(matchup(v))}</td><td>${esc(result(v))}</td></tr>`).join("")
    : `<tr><td colspan="4">No games yet. Add a date and opponent to a row in the sheet to see it here.</td></tr>`;
  if (log.length) body.querySelectorAll("tr").forEach((tr, i) => tr.addEventListener("click", () => {
    select(log[i].park);
    document.getElementById("mapWrap").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
  }));

  selected = null;
  select(log.length ? log[0].park : allParks[0]);
  scalePins();
}

/* Pins stay a tappable size on screen. Where parks sit too close together
   (New York, Chicago, Los Angeles, the Northeast on phones), pins are nudged
   apart and a thin line points back to the park's real location. */
const PIN_PX = 20, GAP_PX = 3;
const leaderLayer = document.getElementById("leaders");
function scalePins() {
  const w = svg.getBoundingClientRect().width;
  if (!w || !allParks.length) return;
  const s = w / 1000;                       // screen px per map unit
  const k = PIN_PX / 16 / s;                // pin art is 16 units across
  const minD = (PIN_PX + GAP_PX) / s;       // required spacing in map units
  const pts = allParks.map(p => ({ p, ax: +p.el.dataset.x, ay: +p.el.dataset.y, x: +p.el.dataset.x, y: +p.el.dataset.y }));
  for (let iter = 0; iter < 300; iter++) {
    let moved = false;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= minD) continue;
      if (d < 1e-6) { const ang = (i * 2.399) % (2 * Math.PI); dx = Math.cos(ang); dy = Math.sin(ang); d = 1; }
      const push = (minD - d) / 2 + 0.01, ux = dx / d, uy = dy / d;
      a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push;
      moved = true;
    }
    for (const q of pts) {                  // gentle pull home, stay inside the frame
      q.x += (q.ax - q.x) * 0.02; q.y += (q.ay - q.y) * 0.02;
      const m = minD / 2; q.x = Math.min(1000 - m, Math.max(m, q.x)); q.y = Math.min(580 - m, Math.max(m, q.y));
    }
    if (!moved && iter > 20) break;
  }
  leaderLayer.replaceChildren();
  for (const q of pts) {
    q.p.px = q.x; q.p.py = q.y;
    q.p.el.setAttribute("transform", `translate(${q.x} ${q.y}) scale(${k})`);
    if (Math.hypot(q.x - q.ax, q.y - q.ay) > 2 / s) {
      const line = document.createElementNS(NS, "line");
      line.setAttribute("class", "leader");
      line.setAttribute("x1", q.ax); line.setAttribute("y1", q.ay);
      line.setAttribute("x2", q.x); line.setAttribute("y2", q.y);
      const dot = document.createElementNS(NS, "circle");
      dot.setAttribute("class", "anchor");
      dot.setAttribute("cx", q.ax); dot.setAttribute("cy", q.ay); dot.setAttribute("r", 1.8 / s);
      leaderLayer.append(line, dot);
    }
  }
}
function positionTip(p) {
  const s = svg.getBoundingClientRect().width / 1000;
  tip.style.left = `${(p.px ?? p.el.dataset.x) * s}px`;
  tip.style.top = `${(p.py ?? p.el.dataset.y) * s - (PIN_PX / 2 - 6)}px`;
}
new ResizeObserver(scalePins).observe(svg);

function select(p) {
  if (selected) selected.el.setAttribute("aria-pressed", "false");
  selected = p;
  p.el.setAttribute("aria-pressed", "true");
  pinLayer.appendChild(p.el); // draw on top
  const where = [p.team, p.city].filter(Boolean).join(", ");
  card.innerHTML = `<h2>${esc(p.name)}</h2><p class="where">${esc(where)}${p.current ? "" : " (former or non-MLB park)"}</p>` +
    (p.visits.length
      ? `<ol>${p.visits.map(v => `<li><time datetime="${v.date}">${fmtDate(v.date)}</time><span class="game">${esc(matchup(v))}</span>${result(v) ? `<span class="result">${esc(result(v))}</span>` : ""}</li>`).join("")}</ol>`
      : `<p class="empty">Not visited yet.</p>`);
  body.querySelectorAll("tr[data-park]").forEach(tr => tr.classList.toggle("current", tr.dataset.park === key(p.name)));
}

/* ---------- Load: Google Sheet first, built-in games as a fallback ---------- */
(async () => {
  if (!SHEET_CSV_URL) { render(VISITS_CSV); return; }
  tally.textContent = "Loading games from the sheet…";
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error("not CSV"); // a sign-in page or an unpublished sheet
    render(text);
  } catch (err) {
    console.warn("Google Sheet didn’t load:", err);
    render(VISITS_CSV);
  }
})();
</script>
